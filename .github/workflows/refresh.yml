name: Refresh fantasy data

on:
  schedule:
    # Runs at 12:00 and 21:00 UTC daily (~10pm and 7am Melbourne, AEST/AEDT
    # varies) - adjust to taste, e.g. more often on Sun/Mon during games.
    - cron: '0 12,21 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - run: python scripts/refresh_data.py

      - name: Commit updated data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --staged --quiet && echo "No changes" || git commit -m "Refresh fantasy data"
          git push
