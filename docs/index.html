<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fantasy Season Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1a2332">
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #1a2332;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #2f6fed;
    --ok: #1a8a4a;
    --warn: #b8860b;
    --bad: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14181f;
      --card: #1e242e;
      --text: #eef1f5;
      --muted: #9aa4b2;
      --border: #303845;
      --accent: #6c9bff;
      --ok: #35c073;
      --warn: #e0a52c;
      --bad: #e0574c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: 3rem;
    transition: background 0.25s ease;
  }
  /* Per-league color themes, set on <body> by JS once a league is picked. */
  body.theme-blue {
    background: #1e3a8a;
  }
  body.theme-green {
    background: #14532d;
  }
  body.theme-blue header h1, body.theme-blue header p,
  body.theme-green header h1, body.theme-green header p {
    color: #fff;
  }
  body.theme-blue select, body.theme-green select {
    border-color: transparent;
  }
  body.theme-blue .empty, body.theme-blue .loading, body.theme-blue footer,
  body.theme-green .empty, body.theme-green .loading, body.theme-green footer {
    color: rgba(255, 255, 255, 0.75);
  }
  header {
    padding: 1.25rem 1rem 1rem;
    text-align: center;
  }
  header h1 {
    font-size: 1.3rem;
    margin: 0 0 0.15rem;
  }
  header p {
    margin: 0;
    color: var(--muted);
    font-size: 0.85rem;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 0 1rem;
  }
  .pickers {
    display: flex;
    gap: 0.6rem;
    margin-bottom: 1rem;
  }
  select {
    flex: 1;
    padding: 0.6rem 0.7rem;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 0.95rem;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1rem;
    margin-bottom: 1rem;
  }
  .alert-summary {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-weight: 600;
  }
  .alert-summary.ok { color: var(--ok); }
  .alert-summary.warn { color: var(--bad); }
  h2 {
    font-size: 0.95rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin: 1.4rem 0 0.6rem;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.55rem 0;
    border-bottom: 1px solid var(--border);
  }
  .row:last-child { border-bottom: none; }
  .slot {
    font-size: 0.72rem;
    color: var(--muted);
    width: 2.6rem;
    flex-shrink: 0;
  }
  .name { flex: 1; font-size: 0.92rem; }
  .name .meta { display: block; color: var(--muted); font-size: 0.76rem; }
  .badge {
    font-size: 0.72rem;
    font-weight: 700;
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
    white-space: nowrap;
  }
  .badge.OK { color: var(--ok); background: color-mix(in srgb, var(--ok) 15%, transparent); }
  .badge.BYE { color: var(--warn); background: color-mix(in srgb, var(--warn) 15%, transparent); }
  .badge.QUESTIONABLE { color: var(--warn); background: color-mix(in srgb, var(--warn) 15%, transparent); }
  .badge.OUT { color: var(--bad); background: color-mix(in srgb, var(--bad) 15%, transparent); }
  .swap {
    font-size: 0.78rem;
    color: var(--accent);
    margin-top: 0.15rem;
  }
  details summary {
    cursor: pointer;
    color: var(--muted);
    font-size: 0.85rem;
    padding: 0.4rem 0;
  }
  .empty, .loading {
    text-align: center;
    color: var(--muted);
    padding: 2rem 1rem;
    font-size: 0.9rem;
  }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.72rem;
    margin-top: 1.5rem;
  }
</style>
</head>
